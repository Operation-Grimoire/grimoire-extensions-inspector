<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grimoire Source Inspector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <strong>Grimoire Source Inspector</strong>
    <span id="status" class="muted"></span>
    <span class="spacer"></span>
    <button id="runAllBtn">Run full suite</button>
  </header>
  <div id="layout">
    <aside id="sidebar">
      <input id="filterSources" placeholder="filter sources…" />
      <ul id="sourceList"></ul>
    </aside>
    <main id="main">
      <div id="welcome" class="pad muted">Pick a source on the left to browse it like the app, or “Run full suite” for the debugger report.</div>
      <section id="sourceView" hidden>
        <div id="sourceHead"></div>
        <nav id="tabs"></nav>
        <div id="tabBody" class="pad"></div>
      </section>
      <section id="reportView" hidden>
        <div class="pad"><button id="closeReport">← back</button> <span id="reportSummary"></span></div>
        <div id="reportBody" class="pad"></div>
      </section>
    </main>
  </div>
  <div id="modal" hidden>
    <div id="modalCard">
      <button id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
