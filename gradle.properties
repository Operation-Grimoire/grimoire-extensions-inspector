org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# The extensions repo path is REQUIRED at run time — pass it per invocation:
#   ./gradlew run -Pext=/path/to/grimoire-extensions --args="run --all --json"
# To avoid retyping, you may instead set a default here (or in
# ~/.gradle/gradle.properties):
# grimoireExtDir=C:/Users/you/GitHub/grimoire-extensions
# Optional overrides (default next to / inside -Pext):
# grimoireApiDir=C:/Users/you/GitHub/grimoire-extensions-api
# grimoireLibDir=C:/Users/you/GitHub/grimoire-extensions/lib
# grimoireIncludeX=true
# grimoireExtXDir=C:/Users/you/GitHub/grimoire-extensions-x

grimoireExtDir=../grimoire-extensions